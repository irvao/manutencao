<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2151C">
<meta name="description" content="Óticas Diniz: informe o que precisa de manutenção na sua loja.">
<title>Manutenção das Lojas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C2151C'/%3E%3Cpath d='M14.5 6.2a3.6 3.6 0 0 0-4.6 4.6L5 15.7a1.6 1.6 0 0 0 2.3 2.3l4.9-4.9a3.6 3.6 0 0 0 4.6-4.6l-2.2 2.2-2-.3-.3-2z' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <span id="logo"></span>
  <div><b>Óticas Diniz</b><small>Manutenção das lojas</small></div>
</header>

<main class="form-wrap">
  <section id="telaForm">
    <div class="intro">
      <h1>O que precisa de conserto na sua loja?</h1>
      <p>Conte cada problema separado: algo quebrado, vazamento, infiltração, lâmpada queimada, móvel ruim, qualquer coisa. Se puder, mande foto.</p>
    </div>

    <div class="passo">1 · Quem está respondendo</div>
    <div class="card">
      <label class="rot" for="loja">Sua loja <span class="req">*</span></label>
      <select id="loja" autocomplete="off"><option value="">Toque para escolher a loja</option></select>
      <label class="rot" for="nome">Seu nome <span class="req">*</span></label>
      <input type="text" id="nome" autocomplete="name" placeholder="Ex.: Maria Souza" maxlength="80">
    </div>

    <label class="tudo-ok" id="tudoOkBox">
      <input type="checkbox" id="tudoOk">
      <span><b>Está tudo certo na minha loja.</b><br><span class="small muted">Marque só se não houver nada para consertar agora.</span></span>
    </label>

    <div id="blocoItens">
      <div class="passo">2 · Problemas</div>
      <div id="itens"></div>
      <button type="button" class="btn-add" id="addItem">+ Adicionar outro problema</button>
    </div>
  </section>

  <section id="telaOk" class="ok-tela" hidden>
    <div class="sel"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1>Recebido, obrigado!</h1>
    <p id="okTexto"></p>
    <ul id="okLista"></ul>
    <button class="btn pri" id="novo" type="button">Informar outro problema</button>
  </section>
</main>

<div class="barra-enviar" id="barra">
  <div class="in">
    <button class="btn pri" id="enviar" type="button">Enviar</button>
    <div class="prog" id="prog" aria-live="polite"></div>
  </div>
</div>

<script src="js/dados.js"></script>
<script src="js/comum.js"></script>
<script src="js/formulario.js"></script>
</body>
</html>
