<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#C2151C">
<meta name="robots" content="noindex">
<title>Painel de Manutenção</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23C2151C'/%3E%3Cpath d='M14.5 6.2a3.6 3.6 0 0 0-4.6 4.6L5 15.7a1.6 1.6 0 0 0 2.3 2.3l4.9-4.9a3.6 3.6 0 0 0 4.6-4.6l-2.2 2.2-2-.3-.3-2z' fill='none' stroke='white' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header class="topo">
  <span id="logo"></span>
  <div><b>Painel de Manutenção</b><small>Óticas Diniz · diretoria</small></div>
  <div class="acoes" id="acoesTopo" hidden>
    <button type="button" id="btAtualizar">Atualizar</button>
    <button type="button" id="btSair">Sair</button>
  </div>
</header>

<section class="login" id="telaLogin">
  <div class="card">
    <h1>Entrar no painel</h1>
    <p class="muted small" style="margin:0 0 12px">Área só da diretoria. As lojas usam o formulário.</p>
    <form id="fLogin">
      <label class="rot" for="senha">Senha</label>
      <input type="password" id="senha" autocomplete="current-password" required>
      <button class="btn pri" style="width:100%;margin-top:14px" type="submit" id="btEntrar">Entrar</button>
    </form>
  </div>
</section>

<main class="painel" id="telaPainel" hidden>
  <div class="kpis" id="kpis"></div>

  <div class="filtros">
    <select id="fStatus" aria-label="Status">
      <option value="pendentes">Não resolvidos</option>
      <option value="Aberto">Só abertos</option>
      <option value="Enviado">Só enviados ao profissional</option>
      <option value="Resolvido">Só resolvidos</option>
      <option value="">Todos</option>
    </select>
    <select id="fUrg" aria-label="Urgência">
      <option value="">Qualquer urgência</option>
    </select>
    <input type="search" id="fBusca" placeholder="Buscar na descrição, local ou nome">
    <button class="btn sm" type="button" id="btLinkForm" title="Copia o link para mandar no grupo das lojas">Copiar link do formulário</button>
    <a class="btn sm" id="lnPlanilha" target="_blank" rel="noopener" hidden>Abrir planilha</a>
    <a class="btn sm" id="lnPasta" target="_blank" rel="noopener" hidden>Pasta de fotos</a>
  </div>

  <div class="abas" role="tablist">
    <button class="aba" role="tab" aria-selected="true" data-aba="cat">Por categoria</button>
    <button class="aba" role="tab" aria-selected="false" data-aba="loja">Por loja</button>
  </div>

  <div class="layout">
    <nav class="lista-lado" id="lado" aria-label="Lista"></nav>
    <section id="conteudo"></section>
  </div>
</main>

<div id="impressao"></div>

<script src="js/dados.js"></script>
<script src="js/comum.js"></script>
<script src="js/painel.js"></script>
</body>
</html>
